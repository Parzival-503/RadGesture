<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
  <title>Reference Library</title>
  <link rel="stylesheet" href="../settings/settings.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="viewer">
  <header class="vbar">
    <button class="iconbtn" id="home" title="Everything in the library" aria-label="Everything in the library"><span class="msym">menu_book</span></button>
    <h1 id="title">Reference Library</h1>
    <span id="tags"></span>
    <span class="grow"></span>
    <label class="vsearch" title="Find in the library (Ctrl+F)">
      <span class="msym">search</span>
      <input type="search" id="find" placeholder="Find in library" autocomplete="off" spellcheck="false">
    </label>
    <span class="zoombar" id="zoombar" hidden>
      <button class="iconbtn" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out"><span class="msym">zoom_out</span></button>
      <button class="btn ghost small" id="zoomPct" title="Actual size (1)">100%</button>
      <button class="iconbtn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><span class="msym">zoom_in</span></button>
      <button class="btn ghost small" id="zoomFit" title="Fit to the window (0)"><span class="msym">fit_screen</span>Fit</button>
    </span>
    <span class="vmenu">
      <button class="btn ghost small" id="newNote" title="A new note, in the section you pick"><span class="msym">note_add</span>New note</button>
      <div class="vpop" id="newPop" hidden></div>
    </span>
    <button class="btn ghost small" id="edit" title="Edit it here (E)"><span class="msym">edit</span>Edit</button>
    <button class="btn primary small" id="done" hidden><span class="msym">check</span>Done</button>
    <button class="iconbtn" id="more" title="Sections, tags and the rest: open in Settings" aria-label="Open in Settings"><span class="msym">open_in_new</span></button>
    <button class="iconbtn" id="close" title="Close (Esc)" aria-label="Close"><span class="msym">close</span></button>
  </header>
  <main id="page" class="md"></main>
  <script src="../common/themes.js"></script>
  <script src="../common/markdown.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
